{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'app/css/buscar.css' %}">

{% block indice %}
<h2>Buscar personajes</h2>
{% endblock %}

{% block content %}
<div class="personajes-lista">
    {% for personaje in personajes %}
    <div class="personaje-row">
        <span>{{ personaje }}</span>
        <a href="{% url 'info_personaje' personaje.id %}">
            <button>Ver info</button>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
