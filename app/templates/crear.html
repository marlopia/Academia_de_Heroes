{% extends "base.html" %}

{% block indice %}
<h2>Crear personaje</h2>
{% endblock %}

{% block content %}
<form method="post">

    {% csrf_token %}

    <label>Nombre:</label>
    <input type="text" name="nombre">

    <label>Nivel:</label>
    <input type="number" name="nivel">

    <label>Vida:</label>
    <input type="number" name="vida">

    <button type="submit">Crear</button>

</form>
{% endblock %}
